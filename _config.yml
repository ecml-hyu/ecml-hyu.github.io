title: ECML Lab
tagline: Water Intelligence
description: ECML Lab, Hanyang University
url: "https://ecml.hanyang.ac.kr"
baseurl: ""
lang: en

# 소셜/OG 기본 이미지 (head.html 에서 사용)
og_image: /assets/img/hero.webp

# 사진을 아직 넣지 않은 구성원에게 쓸 기본 이미지.
# 다른 그림으로 바꾸려면 이 경로의 파일을 갈아끼우거나 아래 경로를 바꾸면 된다.
# 값을 비우면(null) 기본 이미지 대신 이름 이니셜이 나온다.
# 주의: 파일 이름을 밑줄(_)로 시작하지 말 것. Jekyll 이 빌드에서 제외해
#       404 가 되고 깨진 이미지가 뜬다. (실제로 한 번 그렇게 배포됐다)
default_member_photo: /assets/img/members/default-avatar.svg

# 뉴스룸 '새 게시물' 버튼이 GitHub 작성 화면을 열 때 사용한다.
repository: ecml-hyu/ecml-hyu.github.io
branch: main

# 뉴스 글 주소는 아래 defaults 안에서만 지정한다.
#
# 주의: 최상위에 permalink: 를 두면 게시물뿐 아니라 '페이지' URL 까지 바뀐다.
#       research.html 이 /research/ 로 옮겨가 기존 주소가 전부 404 가 된다.
#       (실제로 한 번 그렇게 배포됐다.) 반드시 type: posts 스코프 안에 둘 것.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /newsroom/:year/:month/:day/:title/

# GitHub Pages 화이트리스트 플러그인만 사용
plugins:
  - jekyll-feed
  - jekyll-sitemap

# site.css 와 intro-spline.css 는 일부러 순수 CSS 로 둔다 (SCSS 로 바꾸지 말 것).
# Sass 는 min()/max() 를 내장 함수로 해석해서 min(1120px, calc(...)) 에서
# 빌드를 실패시킨다. sass_dir 을 쓰지 않으므로 Jekyll 은 그대로 복사만 한다.

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
