# status       : registered(등록) / submitted(출원)
# number       : 특허번호. 한국은 10-XXXXXXX, 미국은 USXXXXXXX 형태
# jurisdiction : Korea / US Patent / China / PCT
# id           : 구 홈페이지의 원본 순번.
#                주의 — 출원/등록 섹션별로 따로 매겨져 (9)번이 둘 있다.
#                고유 식별은 number 로 할 것.
# url          : 특허 원문 링크. 한국 건은 doi.org 형태지만 실제 DOI 가 아니라
#                KIPRIS 출원번호 리다이렉트다.

