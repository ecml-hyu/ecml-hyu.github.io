<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted research workflow</title>
  <desc id="desc">Two AI assistant workspaces connected to literature, code, data, and researcher review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10162b"/><stop offset="1" stop-color="#07121f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#9e84ff"/><stop offset="1" stop-color="#62d8ed"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#a181ff" stop-opacity=".25"/><stop offset="1" stop-color="#a181ff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="320" cy="178" r="170" fill="url(#halo)" filter="url(#soft)"/>
  <g fill="#0a1828" stroke="#8d7cef" stroke-opacity=".65">
    <rect x="63" y="65" width="205" height="226" rx="16"/><rect x="372" y="65" width="205" height="226" rx="16"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M268 147C303 147 300 107 320 107s17 40 52 40M268 217c35 0 34 40 52 40s17-40 52-40"/>
    <circle cx="320" cy="182" r="38"/>
  </g>
  <circle cx="320" cy="182" r="27" fill="#1c2853" stroke="#c0b4ff"/>
  <path d="M305 182c10-19 20-19 30 0-10 19-20 19-30 0Z" fill="#bca8ff"/><circle cx="320" cy="182" r="5" fill="#f2f0ff"/>
  <g fill="#e0ebfa" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" paint-order="stroke" stroke="#06131f" stroke-width="2" stroke-opacity=".75">
    <text x="91" y="105">Literature</text><text x="400" y="105">Code &amp; data</text>
  </g>
  <g stroke-linecap="round">
    <path d="M91 131h129M91 151h102M91 171h142M91 191h86" stroke="#7991ab" stroke-width="6" opacity=".55"/>
    <path d="M400 132h92M400 153h131M400 174h106M400 195h143" stroke="#8c7fe6" stroke-width="6" opacity=".6"/>
    <path d="M91 239h68M168 239h66" stroke="#5bd9ed" stroke-width="8" opacity=".65"/>
    <path d="M400 239h47M456 239h85" stroke="#b498ff" stroke-width="8" opacity=".65"/>
  </g>
  <g fill="#f0f6ff"><circle cx="268" cy="147" r="4"/><circle cx="268" cy="217" r="4"/><circle cx="372" cy="147" r="4"/><circle cx="372" cy="217" r="4"/></g>
  <rect x="238" y="298" width="164" height="30" rx="15" fill="#101e31" stroke="#9bcce7" stroke-opacity=".65"/>
  <text x="320" y="318" fill="#eefaff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing=".3">Researcher review</text>
