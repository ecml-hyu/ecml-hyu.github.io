<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Life-cycle assessment system</title>
  <desc id="desc">A circular material and energy pathway connecting resources, process, use, and recovery.</desc>
