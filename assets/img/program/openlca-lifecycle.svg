  <g fill="#09232c" stroke="#65dcb3">
    <rect x="130" y="72" width="95" height="47" rx="12"/><rect x="420" y="66" width="96" height="47" rx="12"/><rect x="438" y="248" width="96" height="47" rx="12"/><rect x="105" y="246" width="108" height="47" rx="12"/>
