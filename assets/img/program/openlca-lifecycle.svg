    <linearGradient id="cycle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ee0a4"/><stop offset=".55" stop-color="#70d9d2"/><stop offset="1" stop-color="#5ba9f0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#67debd"/></marker>
